# Tests
name: Tests

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: strive-backend/package-lock.json

      - name: Install backend dependencies
        working-directory: strive-backend
        run: npm ci

      # The integration tests download a MongoDB binary once; keep it between runs
      - name: Cache MongoDB test binary
        uses: actions/cache@v4
        with:
          path: strive-backend/node_modules/.cache/mongodb-memory-server
          key: mongodb-memory-server-${{ runner.os }}-${{ hashFiles('strive-backend/package-lock.json') }}

      - name: Run backend tests (unit and integration)
        working-directory: strive-backend
        run: npm test

      # Reports known vulnerabilities in production dependencies. Not blocking: it warns.
      - name: Audit backend dependencies
        working-directory: strive-backend
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: strive-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: strive-frontend
        run: npm ci

      - name: Lint
        working-directory: strive-frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: strive-frontend
        run: npm test

      - name: Build
        working-directory: strive-frontend
        run: npm run build

      - name: Audit frontend dependencies
        working-directory: strive-frontend
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
