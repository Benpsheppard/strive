# Tests
name: Tests
run-name: Tests (${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at }})

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install backend dependencies
        working-directory: strive-backend
        run: npm ci

      - name: Run backend tests
        working-directory: strive-backend
        run: npm test