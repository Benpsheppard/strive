# Tests
name: Tests

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: strive-backend/package-lock.json

      - name: Install backend dependencies
        working-directory: strive-backend
        run: npm ci

      - name: Run backend tests
        working-directory: strive-backend
        run: npm test

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: strive-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: strive-frontend
        run: npm ci

      - name: Lint
        working-directory: strive-frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: strive-frontend
        run: npm test

      - name: Build
        working-directory: strive-frontend
        run: npm run build
